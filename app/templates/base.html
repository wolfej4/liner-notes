<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}: Liner Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
{% if fonts %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
{% endif %}
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="mark" href="/"><i aria-hidden="true"></i>Liner Notes</a>
    {% if user %}
    <nav class="user-nav" aria-label="Account">
      <a href="/">Dashboard</a>
      <a href="/account" {% if active == "account" %}aria-current="page"{% endif %}>Account</a>
      {% if user.is_admin %}<a href="/admin" {% if active == "admin" %}aria-current="page"{% endif %}>Admin</a>{% endif %}
      <button type="button" class="linklike" data-post="/api/logout">Sign out</button>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap {{ layout or 'narrow' }}">
{% block content %}{% endblock %}
</main>
<div class="flash" id="flash" role="status" aria-live="polite" hidden></div>
<script src="/static/forms.js"></script>
</body>
</html>
