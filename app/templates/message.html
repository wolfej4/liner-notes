{% extends "base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<p class="lede">{{ message }}</p>
{% if action_url %}
{% if action_post %}
<button class="btn primary" type="button" data-post="{{ action_url }}" data-reload>{{ action_label }}</button>
{% else %}
<a class="btn primary" href="{{ action_url }}">{{ action_label }}</a>
{% endif %}
{% endif %}
{% endblock %}
