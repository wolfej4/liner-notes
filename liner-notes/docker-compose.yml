services:
  liner-notes:
    build: .
    image: liner-notes:latest
    container_name: liner-notes
    restart: unless-stopped
    environment:
      # The address people open Liner Notes at. Can also be changed later on the admin page.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Optional: everything below can be set on the admin page instead.
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # The app runs as this user; the data volume is handed to it on startup.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=America/Chicago
    ports:
      - "8089:8080"
    volumes:
      # A named Docker volume: no host folder to create or fix permissions on.
      # To use a host folder instead, e.g. /opt/liner-notes, change this to /opt/liner-notes:/data
      - liner-notes-data:/data

volumes:
  liner-notes-data:
